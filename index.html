<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Platform</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #f3f4f6, #e4e7eb);
            color: #333;
        }
        header {
            background: #4A90E2;
            padding: 20px;
            text-align: center;
            color: white;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .hero {
            background: url('https://source.unsplash.com/random/1600x900');
            background-size: cover;
            padding: 100px 20px;
            text-align: center;
            color: white;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 50px 20px;
        }
        .feature {
            background: white;
            border-radius: 10px;
            margin: 20px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1 1 300px;
            transition: transform 0.2s;
        }
        .feature:hover {
            transform: translateY(-5px);
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Study Platform</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <h2>Welcome to Our Study Platform</h2>
        <p>Your journey to learning starts here!</p>
    </section>
    <section class="features">
        <div class="feature">
            <h3>Feature One</h3>
            <p>Engaging lessons tailored to your needs.</p>
        </div>
        <div class="feature">
            <h3>Feature Two</h3>
            <p>Interactive quizzes to test your knowledge.</p>
        </div>
        <div class="feature">
            <h3>Feature Three</h3>
            <p>Track your learning progress easily.</p>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Study Platform</p>
    </footer>
</body>
</html>
